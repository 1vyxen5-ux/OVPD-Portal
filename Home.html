<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCPD Portal - Archives</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #12141c;
            --card-border: #1f222e;
            --text-main: #ffffff;
            --text-muted: #8c909d;
            --accent-glow: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--card-border);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 16px;
        }

        .nav-left span {
            color: var(--text-muted);
            font-weight: 400;
        }

        .nav-center {
            display: flex;
            gap: 25px;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-center a {
            text-decoration: none;
            color: var(--text-muted);
            padding-bottom: 4px;
            transition: color 0.2s;
        }

        .nav-center a.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--text-main);
        }

        .nav-center a:hover {
            color: var(--text-main);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-muted);
            font-size: 16px;
        }

        /* Main Content Section */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 50px;
        }

        /* Cards Grid */
        .cards-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 900px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 360px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #3a3f55;
        }

        .card-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid var(--card-border);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 4px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .footer-links a:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="nav-left">
            🛡️ HCPD <span>Portal</span>
        </div>
        <div class="nav-center">
            <a href="#" class="active">HANDBOOKS</a>
            <a href="#">HQ DECISIONS</a>
            <a href="#">ROSTER ▾</a>
        </div>
        <div class="nav-right">
            🔍 🔔 ⚙️
        </div>
    </header>

    <!-- Main Content Area -->
    <main>
        <h1>HCPD Archives</h1>
        <div class="subtitle">Select a division to view authorized operational assets.</div>

        <div class="cards-container">
            <!-- SWAT Card -->
            <div class="card" onclick="alert('SWAT Handbooks clicked!')">
                <div class="card-title">SWAT</div>
                <div class="card-desc">4 Handbooks Available</div>
            </div>

            <!-- General Card -->
            <div class="card" onclick="alert('General Handbooks clicked!')">
                <div class="card-title">GENERAL</div>
                <div class="card-desc">3 Handbooks Available</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div>HCPD PORTAL @ 2026</div>
        <div>FOUNDER & DEVELOPER — SIMEONCHO</div>
        <div class="footer-links">
            <a href="#">PRIVACY POLICY</a>
            <a href="#">TERMS OF SERVICE</a>
        </div>
    </footer>

</body>
</html>
