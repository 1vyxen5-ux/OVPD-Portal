<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVPD Portal - ADU</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #12141c;
            border-bottom: 1px solid #222736;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 18px;
        }
        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .nav-links a {
            color: #8c92a4;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-links a.active {
            color: #ffffff;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 4px;
        }
        .nav-right {
            display: flex;
            gap: 20px;
            align-items: center;
            color: #8c92a4;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            background-color: #0b0c10;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .subtitle {
            color: #8c92a4;
            font-size: 14px;
            margin-bottom: 40px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #12141c;
            border: 1px solid #1f2833;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .back-btn:hover {
            border-color: #45a29e;
        }
        footer {
            text-align: center;
            padding: 30px;
            font-size: 11px;
            color: #666c7d;
            background-color: #12141c;
            border-top: 1px solid #222736;
            line-height: 1.8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        footer div {
            margin-bottom: 4px;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 6px;
        }
        .footer-links a {
            color: #666c7d;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-left">
            <span>🛡️</span> OVPD <span style="color: #8c92a4; font-weight: 400;">Portal</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Handbooks</a>
            <a href="#">HQ Decisions</a>
            <a href="#">Roster ▾</a>
        </div>
        <div class="nav-right">
            <span>🔍</span>
            <span>🔔</span>
            <span>👤</span>
        </div>
    </header>

    <main>
        <h1>ADU Division</h1>
        <div class="subtitle">Authorized operational assets and handbooks.</div>
        <p style="color: #8c92a4;">Document list coming soon...</p>
        <a href="index.html" class="back-btn">← Back to Archives</a>
    </main>

    <footer>
        <div>OVPD PORTAL @ 2026</div>
        <div>FOUNDER & DEVELOPER — 1VYXEN5</div>
        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
        </div>
    </footer>

</body>
</html>
